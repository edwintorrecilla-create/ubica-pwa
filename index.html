<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ubica — Buscador de Insumos en Almacén</title>
<meta name="description" content="Encuentra la ubicación exacta de un insumo en el almacén, por texto o por voz.">
<meta name="theme-color" content="#1B2027">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ubica">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg: #1B2027;
    --bg-elev: #232A32;
    --bg-elev-2: #2B333C;
    --border: #39434D;
    --text: #ECEEEF;
    --text-dim: #93A0AA;
    --yellow: #F5B400;
    --yellow-deep: #C68F00;
    --blue: #4F86A6;
    --blue-deep: #35617D;
    --green: #4CAF7D;
    --red: #E1573F;
    --font-display: 'Oswald', 'Arial Narrow', sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'IBM Plex Mono', 'SF Mono', Consolas, monospace;
    --radius: 3px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    line-height: 1.45;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
  button, select, input{ font-family: inherit; }
  :focus-visible{ outline: 2px solid var(--yellow); outline-offset: 2px; }

  #app{ max-width: 1080px; margin: 0 auto; padding: 20px 20px 60px; }

  /* ---- Topbar ---- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap: 16px; padding: 18px 0 20px; border-bottom: 1px solid var(--border);
    margin-bottom: 22px; flex-wrap: wrap;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    width: 40px; height:40px; border: 2px solid var(--yellow); border-radius: var(--radius);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-display); font-weight:700; font-size: 18px; color: var(--yellow);
    background: repeating-linear-gradient(135deg, rgba(245,180,0,0.08) 0 6px, transparent 6px 12px);
    flex-shrink:0;
  }
  .brand-text h1{
    font-family: var(--font-display); font-size: 21px; font-weight:600; letter-spacing:0.5px;
    margin:0; text-transform: uppercase;
  }
  .brand-text p{ margin:2px 0 0; font-size:12px; color: var(--text-dim); font-family: var(--font-mono); }
  .topbar-meta{ display:flex; align-items:center; gap:10px; font-size:12px; color: var(--text-dim); font-family: var(--font-mono); }
  .topbar-meta button{
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    padding: 6px 10px; border-radius: var(--radius); cursor:pointer; font-size:12px;
  }
  .topbar-meta button:hover{ border-color: var(--yellow); color: var(--yellow); }

  .install-row{ display:flex; flex-wrap:wrap; gap:8px; margin: -8px 0 18px; }
  .status-pill{
    font-family: var(--font-mono); font-size: 12px; border-radius: 999px;
    padding: 6px 12px; border: 1px solid var(--border); background: var(--bg-elev);
    display:inline-flex; align-items:center; gap:8px; color: var(--text-dim);
  }
  .status-pill.offline{ border-color: var(--red); color: var(--red); }
  .status-pill.install{ border-color: var(--yellow); color: var(--yellow); cursor:pointer; font-weight:600; }
  .status-pill.install:hover{ background: rgba(245,180,0,0.1); }
  .status-pill.ios-tip{ border-color: var(--blue); color: var(--blue); }
  .status-pill.ios-tip button{ background:transparent; border:none; color: inherit; cursor:pointer; font-size:12px; padding:0 0 0 2px; }

  .system-switch{ display:flex; gap:8px; margin: -6px 0 22px; }
  .sys-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
    background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-dim);
    font-family: var(--font-display); font-size:14px; text-transform:uppercase; letter-spacing:0.6px;
    padding: 12px 14px; border-radius: var(--radius); cursor:pointer;
    transition: border-color .15s, color .15s, background .15s;
  }
  .sys-btn:hover{ color: var(--text); }
  .sys-btn.active{
    border-color: var(--sys-color); color: var(--text); background: var(--bg-elev-2);
    box-shadow: inset 0 0 0 1px var(--sys-color);
  }
  .sys-dot{ width:9px; height:9px; border-radius:50%; background: var(--sys-color); flex-shrink:0; }
  .sys-count{ font-family: var(--font-mono); font-size:11px; color: var(--text-dim); font-weight:400; }

  @media (max-width: 640px){
    #app{ padding-bottom: 92px; }
    .tabs{
      position: fixed; left:0; right:0; bottom:0; z-index: 50;
      background: var(--bg-elev); border-top: 1px solid var(--border); border-bottom:none;
      display:flex; justify-content: space-around; gap:4px;
      padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
      margin: 0;
    }
    .tab-btn{
      flex:1; border-bottom:none; border-radius: var(--radius); padding: 12px 6px;
      font-size:12px;
    }
    .tab-btn.active{ background: rgba(245,180,0,0.12); border-bottom:none; }
    .mic-btn{ width:36px; height:36px; }
    .placard-code{ letter-spacing:1px; }
  }

  /* ---- Tabs ---- */
  .tabs{ display:flex; gap:6px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
  .tab-btn{
    background:transparent; border:none; color: var(--text-dim);
    font-family: var(--font-display); font-size: 14px; letter-spacing: 0.8px; text-transform: uppercase;
    padding: 10px 16px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom:-1px;
  }
  .tab-btn:hover{ color: var(--text); }
  .tab-btn.active{ color: var(--yellow); border-bottom-color: var(--yellow); }

  /* ---- Empty / dropzone ---- */
  .panel{ background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
  .empty-state{ text-align:center; padding: 50px 20px; }
  .empty-state h2{ font-family: var(--font-display); font-size: 22px; text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 8px; }
  .empty-state p{ color: var(--text-dim); font-size: 14px; margin: 0 0 24px; max-width: 440px; margin-left:auto; margin-right:auto; }

  .dropzone{
    border: 2px dashed var(--border); border-radius: var(--radius); padding: 40px 20px;
    text-align:center; cursor:pointer; transition: border-color .15s, background .15s;
    background: var(--bg-elev-2);
  }
  .dropzone:hover, .dropzone.drag{ border-color: var(--yellow); background: rgba(245,180,0,0.06); }
  .dropzone svg{ margin-bottom: 10px; }
  .dropzone .dz-title{ font-family: var(--font-display); font-size:16px; text-transform: uppercase; letter-spacing:0.5px; }
  .dropzone .dz-sub{ font-size: 12px; color: var(--text-dim); margin-top: 6px; }

  /* ---- Mapping ---- */
  .map-title{ font-family: var(--font-display); font-size:18px; text-transform:uppercase; letter-spacing:0.5px; margin: 0 0 4px; }
  .map-sub{ color: var(--text-dim); font-size: 13px; margin: 0 0 20px; }
  .map-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap: 14px; margin-bottom: 22px; }
  .map-field label{ display:block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-dim); margin-bottom: 6px; font-family: var(--font-mono); }
  .map-field label .req{ color: var(--yellow); }
  .map-field select{
    width:100%; background: var(--bg-elev-2); border: 1px solid var(--border); color: var(--text);
    padding: 9px 10px; border-radius: var(--radius); font-size: 13px;
  }
  .btn{
    font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.6px; font-size: 13px;
    border: none; border-radius: var(--radius); padding: 11px 20px; cursor: pointer;
  }
  .btn-primary{ background: var(--yellow); color: #1B2027; font-weight:600; }
  .btn-primary:hover{ background: #ffc426; }
  .btn-ghost{ background: transparent; border:1px solid var(--border); color: var(--text-dim); }
  .btn-ghost:hover{ border-color: var(--red); color: var(--red); }
  .row-actions{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

  /* ---- Search ---- */
  .search-bar{ display:flex; gap:10px; margin-bottom: 16px; flex-wrap:wrap; }
  .search-input-wrap{ position:relative; flex: 1 1 260px; }
  .search-input-wrap svg{ position:absolute; left: 12px; top: 50%; transform: translateY(-50%); }
  .search-input{
    width:100%; background: var(--bg-elev); border: 1px solid var(--border); color: var(--text);
    padding: 12px 44px 12px 38px; border-radius: var(--radius); font-size: 15px;
  }
  .search-input:focus{ border-color: var(--yellow); }
  .mic-btn{
    position:absolute; right:6px; top:50%; transform: translateY(-50%);
    width:30px; height:30px; border-radius:50%; border:1px solid var(--border);
    background: var(--bg-elev-2); color: var(--text-dim);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition: border-color .15s, background .15s, color .15s;
  }
  .mic-btn:hover{ border-color: var(--yellow); color: var(--yellow); }
  .mic-btn.listening{
    border-color: var(--red); color: var(--red); background: rgba(225,87,63,0.15);
    animation: micPulse 1.1s ease-in-out infinite;
  }
  @keyframes micPulse{
    0%,100%{ box-shadow: 0 0 0 0 rgba(225,87,63,0.35); }
    50%{ box-shadow: 0 0 0 6px rgba(225,87,63,0); }
  }
  .voice-error{ font-size:12px; color: var(--red); margin: -6px 0 12px; }
  .voice-toggle{
    display:flex; align-items:center; gap:7px; font-size:12px; color: var(--text-dim);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 0 12px;
    background: var(--bg-elev); cursor:pointer; user-select:none; white-space:nowrap;
  }
  .voice-toggle .dot{ width:8px; height:8px; border-radius:50%; background: var(--border); transition: background .15s; }
  .voice-toggle.on .dot{ background: var(--green); }
  .voice-toggle.on{ color: var(--text); }
  .placard-actions{ display:flex; gap:8px; flex-shrink:0; }
  .speak-btn{
    background: transparent; border:1px solid var(--yellow); color: var(--yellow);
    border-radius: var(--radius); padding: 6px 10px; cursor:pointer; font-size:12px;
    display:flex; align-items:center; gap:6px; font-family: var(--font-mono);
  }
  .speak-btn:hover{ background: rgba(245,180,0,0.1); }
  .speak-btn.speaking svg{ animation: speakWave .8s ease-in-out infinite; }
  @keyframes speakWave{ 0%,100%{ opacity:1; } 50%{ opacity:0.4; } }
  .filter-select{
    background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-dim);
    padding: 0 10px; border-radius: var(--radius); font-size: 13px; min-width: 140px;
  }
  .results-count{ font-size:12px; color: var(--text-dim); font-family: var(--font-mono); margin: 0 0 10px; }

  .result-row{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--bg-elev); margin-bottom: 8px; cursor:pointer; transition: border-color .12s;
  }
  .result-row:hover{ border-color: var(--yellow); }
  .result-row .rr-name{ font-weight:600; font-size: 14px; }
  .result-row .rr-sub{ font-size:12px; color: var(--text-dim); font-family: var(--font-mono); margin-top:2px; }
  .result-row .rr-loc{ font-family: var(--font-mono); font-size: 13px; color: var(--yellow); white-space:nowrap; }

  /* ---- Placard (signature element) ---- */
  .placard{
    background: linear-gradient(180deg, #12151a 0%, #1c222a 100%);
    border: 3px solid var(--yellow);
    border-radius: 4px;
    padding: 28px 26px;
    margin-bottom: 22px;
    box-shadow: inset 0 0 0 5px rgba(0,0,0,0.35);
    animation: placardIn .22s ease-out;
  }
  @keyframes placardIn{ from{ opacity:0; transform: translateY(-6px);} to{opacity:1; transform:none;} }
  .placard-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
  .placard-eyebrow{ font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); text-transform:uppercase; letter-spacing:1px; }
  .placard-name{ font-family: var(--font-display); font-size: 24px; font-weight:600; margin: 4px 0 14px; text-transform: uppercase; }
  .placard-code{
    font-family: var(--font-display); font-size: clamp(38px, 8vw, 60px); font-weight:700;
    color: var(--yellow); letter-spacing: 3px; line-height:1; word-break: break-word;
  }
  .placard-strip{ display:flex; gap:3px; margin: 16px 0 20px; flex-wrap:wrap; }
  .placard-strip .blk{ width: 16px; height: 8px; border-radius:1px; background: var(--border); }
  .placard-strip .blk.on{ background: var(--yellow); }
  .placard-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(110px,1fr)); gap: 16px; }
  .placard-field .pf-label{ font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); text-transform:uppercase; letter-spacing:0.8px; }
