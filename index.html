<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ubica — Buscador de Insumos en Almacén</title>
<meta name="description" content="Encuentra la ubicación exacta de un insumo en el almacén, por texto o por voz.">
<meta name="theme-color" content="#1B2027">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ubica">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg: #1B2027;
    --bg-elev: #232A32;
    --bg-elev-2: #2B333C;
    --border: #39434D;
    --text: #ECEEEF;
    --text-dim: #93A0AA;
    --yellow: #F5B400;
    --yellow-deep: #C68F00;
    --blue: #4F86A6;
    --blue-deep: #35617D;
    --green: #4CAF7D;
    --red: #E1573F;
    --font-display: 'Oswald', 'Arial Narrow', sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'IBM Plex Mono', 'SF Mono', Consolas, monospace;
    --radius: 3px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    line-height: 1.45;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
  button, select, input{ font-family: inherit; }
  :focus-visible{ outline: 2px solid var(--yellow); outline-offset: 2px; }

  #app{ max-width: 1080px; margin: 0 auto; padding: 20px 20px 60px; }

  /* ---- Topbar ---- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap: 16px; padding: 18px 0 20px; border-bottom: 1px solid var(--border);
    margin-bottom: 22px; flex-wrap: wrap;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    width: 40px; height:40px; border: 2px solid var(--yellow); border-radius: var(--radius);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-display); font-weight:700; font-size: 18px; color: var(--yellow);
    background: repeating-linear-gradient(135deg, rgba(245,180,0,0.08) 0 6px, transparent 6px 12px);
    flex-shrink:0;
  }
  .brand-text h1{
    font-family: var(--font-display); font-size: 21px; font-weight:600; letter-spacing:0.5px;
    margin:0; text-transform: uppercase;
  }
  .brand-text p{ margin:2px 0 0; font-size:12px; color: var(--text-dim); font-family: var(--font-mono); }
  .topbar-meta{ display:flex; align-items:center; gap:10px; font-size:12px; color: var(--text-dim); font-family: var(--font-mono); }
  .topbar-meta button{
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    padding: 6px 10px; border-radius: var(--radius); cursor:pointer; font-size:12px;
  }
  .topbar-meta button:hover{ border-color: var(--yellow); color: var(--yellow); }

  .install-row{ display:flex; flex-wrap:wrap; gap:8px; margin: -8px 0 18px; }
  .status-pill{
    font-family: var(--font-mono); font-size: 12px; border-radius: 999px;
    padding: 6px 12px; border: 1px solid var(--border); background: var(--bg-elev);
    display:inline-flex; align-items:center; gap:8px; color: var(--text-dim);
  }
  .status-pill.offline{ border-color: var(--red); color: var(--red); }
  .status-pill.install{ border-color: var(--yellow); color: var(--yellow); cursor:pointer; font-weight:600; }
  .status-pill.install:hover{ background: rgba(245,180,0,0.1); }
  .status-pill.ios-tip{ border-color: var(--blue); color: var(--blue); }
  .status-pill.ios-tip button{ background:transparent; border:none; color: inherit; cursor:pointer; font-size:12px; padding:0 0 0 2px; }

  @media (max-width: 640px){
    #app{ padding-bottom: 92px; }
    .tabs{
      position: fixed; left:0; right:0; bottom:0; z-index: 50;
      background: var(--bg-elev); border-top: 1px solid var(--border); border-bottom:none;
      display:flex; justify-content: space-around; gap:4px;
      padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
      margin: 0;
    }
    .tab-btn{
      flex:1; border-bottom:none; border-radius: var(--radius); padding: 12px 6px;
      font-size:12px;
    }
    .tab-btn.active{ background: rgba(245,180,0,0.12); border-bottom:none; }
    .mic-btn{ width:36px; height:36px; }
    .placard-code{ letter-spacing:1px; }
  }

  /* ---- Tabs ---- */
  .tabs{ display:flex; gap:6px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
  .tab-btn{
    background:transparent; border:none; color: var(--text-dim);
    font-family: var(--font-display); font-size: 14px; letter-spacing: 0.8px; text-transform: uppercase;
    padding: 10px 16px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom:-1px;
  }
  .tab-btn:hover{ color: var(--text); }
  .tab-btn.active{ color: var(--yellow); border-bottom-color: var(--yellow); }

  /* ---- Empty / dropzone ---- */
  .panel{ background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
  .empty-state{ text-align:center; padding: 50px 20px; }
  .empty-state h2{ font-family: var(--font-display); font-size: 22px; text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 8px; }
  .empty-state p{ color: var(--text-dim); font-size: 14px; margin: 0 0 24px; max-width: 440px; margin-left:auto; margin-right:auto; }

  .dropzone{
    border: 2px dashed var(--border); border-radius: var(--radius); padding: 40px 20px;
    text-align:center; cursor:pointer; transition: border-color .15s, background .15s;
    background: var(--bg-elev-2);
  }
  .dropzone:hover, .dropzone.drag{ border-color: var(--yellow); background: rgba(245,180,0,0.06); }
  .dropzone svg{ margin-bottom: 10px; }
  .dropzone .dz-title{ font-family: var(--font-display); font-size:16px; text-transform: uppercase; letter-spacing:0.5px; }
  .dropzone .dz-sub{ font-size: 12px; color: var(--text-dim); margin-top: 6px; }

  /* ---- Mapping ---- */
  .map-title{ font-family: var(--font-display); font-size:18px; text-transform:uppercase; letter-spacing:0.5px; margin: 0 0 4px; }
  .map-sub{ color: var(--text-dim); font-size: 13px; margin: 0 0 20px; }
  .map-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap: 14px; margin-bottom: 22px; }
  .map-field label{ display:block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-dim); margin-bottom: 6px; font-family: var(--font-mono); }
  .map-field label .req{ color: var(--yellow); }
  .map-field select{
    width:100%; background: var(--bg-elev-2); border: 1px solid var(--border); color: var(--text);
    padding: 9px 10px; border-radius: var(--radius); font-size: 13px;
  }
  .btn{
    font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.6px; font-size: 13px;
    border: none; border-radius: var(--radius); padding: 11px 20px; cursor: pointer;
  }
  .btn-primary{ background: var(--yellow); color: #1B2027; font-weight:600; }
  .btn-primary:hover{ background: #ffc426; }
  .btn-ghost{ background: transparent; border:1px solid var(--border); color: var(--text-dim); }
  .btn-ghost:hover{ border-color: var(--red); color: var(--red); }
  .row-actions{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

  /* ---- Search ---- */
  .search-bar{ display:flex; gap:10px; margin-bottom: 16px; flex-wrap:wrap; }
  .search-input-wrap{ position:relative; flex: 1 1 260px; }
  .search-input-wrap svg{ position:absolute; left: 12px; top: 50%; transform: translateY(-50%); }
  .search-input{
    width:100%; background: var(--bg-elev); border: 1px solid var(--border); color: var(--text);
    padding: 12px 44px 12px 38px; border-radius: var(--radius); font-size: 15px;
  }
  .search-input:focus{ border-color: var(--yellow); }
  .mic-btn{
    position:absolute; right:6px; top:50%; transform: translateY(-50%);
    width:30px; height:30px; border-radius:50%; border:1px solid var(--border);
    background: var(--bg-elev-2); color: var(--text-dim);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition: border-color .15s, background .15s, color .15s;
  }
  .mic-btn:hover{ border-color: var(--yellow); color: var(--yellow); }
  .mic-btn.listening{
    border-color: var(--red); color: var(--red); background: rgba(225,87,63,0.15);
    animation: micPulse 1.1s ease-in-out infinite;
  }
  @keyframes micPulse{
    0%,100%{ box-shadow: 0 0 0 0 rgba(225,87,63,0.35); }
    50%{ box-shadow: 0 0 0 6px rgba(225,87,63,0); }
  }
  .voice-error{ font-size:12px; color: var(--red); margin: -6px 0 12px; }
  .voice-toggle{
    display:flex; align-items:center; gap:7px; font-size:12px; color: var(--text-dim);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 0 12px;
    background: var(--bg-elev); cursor:pointer; user-select:none; white-space:nowrap;
  }
  .voice-toggle .dot{ width:8px; height:8px; border-radius:50%; background: var(--border); transition: background .15s; }
  .voice-toggle.on .dot{ background: var(--green); }
  .voice-toggle.on{ color: var(--text); }
  .placard-actions{ display:flex; gap:8px; flex-shrink:0; }
  .speak-btn{
    background: transparent; border:1px solid var(--yellow); color: var(--yellow);
    border-radius: var(--radius); padding: 6px 10px; cursor:pointer; font-size:12px;
    display:flex; align-items:center; gap:6px; font-family: var(--font-mono);
  }
  .speak-btn:hover{ background: rgba(245,180,0,0.1); }
  .speak-btn.speaking svg{ animation: speakWave .8s ease-in-out infinite; }
  @keyframes speakWave{ 0%,100%{ opacity:1; } 50%{ opacity:0.4; } }
  .filter-select{
    background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-dim);
    padding: 0 10px; border-radius: var(--radius); font-size: 13px; min-width: 140px;
  }
  .results-count{ font-size:12px; color: var(--text-dim); font-family: var(--font-mono); margin: 0 0 10px; }

  .result-row{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--bg-elev); margin-bottom: 8px; cursor:pointer; transition: border-color .12s;
  }
  .result-row:hover{ border-color: var(--yellow); }
  .result-row .rr-name{ font-weight:600; font-size: 14px; }
  .result-row .rr-sub{ font-size:12px; color: var(--text-dim); font-family: var(--font-mono); margin-top:2px; }
  .result-row .rr-loc{ font-family: var(--font-mono); font-size: 13px; color: var(--yellow); white-space:nowrap; }

  /* ---- Placard (signature element) ---- */
  .placard{
    background: linear-gradient(180deg, #12151a 0%, #1c222a 100%);
    border: 3px solid var(--yellow);
    border-radius: 4px;
    padding: 28px 26px;
    margin-bottom: 22px;
    box-shadow: inset 0 0 0 5px rgba(0,0,0,0.35);
    animation: placardIn .22s ease-out;
  }
  @keyframes placardIn{ from{ opacity:0; transform: translateY(-6px);} to{opacity:1; transform:none;} }
  .placard-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
  .placard-eyebrow{ font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); text-transform:uppercase; letter-spacing:1px; }
  .placard-name{ font-family: var(--font-display); font-size: 24px; font-weight:600; margin: 4px 0 14px; text-transform: uppercase; }
  .placard-code{
    font-family: var(--font-display); font-size: clamp(38px, 8vw, 60px); font-weight:700;
    color: var(--yellow); letter-spacing: 3px; line-height:1; word-break: break-word;
  }
  .placard-strip{ display:flex; gap:3px; margin: 16px 0 20px; flex-wrap:wrap; }
  .placard-strip .blk{ width: 16px; height: 8px; border-radius:1px; background: var(--border); }
  .placard-strip .blk.on{ background: var(--yellow); }
  .placard-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(110px,1fr)); gap: 16px; }
  .placard-field .pf-label{ font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); text-transform:uppercase; letter-spacing:0.8px; }
  .placard-field .pf-value{ font-family: var(--font-display); font-size: 20px; margin-top:2px; }
  .placard-field .pf-value.alert{ color: var(--red); }
  .placard-field .pf-value.ok{ color: var(--green); }
  .placard-close{ background:transparent; border:1px solid var(--border); color: var(--text-dim); border-radius: var(--radius); padding: 6px 10px; cursor:pointer; font-size:12px; font-family: var(--font-mono); }
  .placard-close:hover{ color: var(--yellow); border-color: var(--yellow); }

  /* ---- Table ---- */
  .table-wrap{ overflow-x:auto; border: 1px solid var(--border); border-radius: var(--radius); }
  table{ width:100%; border-collapse: collapse; font-size: 13px; }
  th{ text-align:left; font-family: var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color: var(--text-dim); padding: 10px 12px; background: var(--bg-elev-2); border-bottom: 1px solid var(--border); white-space:nowrap; }
  td{ padding: 10px 12px; border-bottom: 1px solid var(--border); }
  tr:last-child td{ border-bottom:none; }
  tr.tr-alert td{ color: var(--red); }
  .pagination{ display:flex; justify-content:space-between; align-items:center; margin-top: 12px; font-size:12px; color: var(--text-dim); font-family: var(--font-mono); }
  .pagination button{ background: var(--bg-elev); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: var(--radius); cursor:pointer; }
  .pagination button:disabled{ opacity: 0.35; cursor:not-allowed; }

  /* ---- Dashboard ---- */
  .kpi-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 14px; margin-bottom: 22px; }
  .kpi-card{ background: var(--bg-elev); border:1px solid var(--border); border-radius: var(--radius); padding: 16px 16px; }
  .kpi-card .kv{ font-family: var(--font-display); font-size: 32px; font-weight:600; color: var(--yellow); }
  .kpi-card.alertc .kv{ color: var(--red); }
  .kpi-card .kl{ font-size: 11px; text-transform: uppercase; letter-spacing:0.6px; color: var(--text-dim); font-family: var(--font-mono); margin-top:4px; }

  .dash-section{ margin-bottom: 26px; }
  .dash-title{ font-family: var(--font-display); font-size: 15px; text-transform: uppercase; letter-spacing: 0.6px; margin: 0 0 12px; color: var(--text-dim); }

  .bar-row{ display:flex; align-items:center; gap: 10px; margin-bottom: 8px; }
  .bar-label{ width: 110px; flex-shrink:0; font-size:12px; font-family: var(--font-mono); color: var(--text-dim); text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar-track{ flex:1; background: var(--bg-elev-2); border-radius: 2px; height: 16px; overflow:hidden; }
  .bar-fill{ height:100%; background: linear-gradient(90deg, var(--blue-deep), var(--blue)); border-radius: 2px; transition: width .3s ease; }
  .bar-val{ width: 34px; text-align:right; font-family: var(--font-mono); font-size:12px; color: var(--text-dim); }

  .donut-wrap{ display:flex; align-items:center; gap: 26px; flex-wrap:wrap; }
  .legend{ display:flex; flex-direction:column; gap:8px; }
  .legend-item{ display:flex; align-items:center; gap:8px; font-size:12px; }
  .legend-dot{ width:10px; height:10px; border-radius: 2px; flex-shrink:0; }

  .alert-list .alert-item{ display:flex; justify-content:space-between; align-items:center; padding: 10px 12px; border: 1px solid var(--red); border-left-width:4px; border-radius: var(--radius); background: rgba(225,87,63,0.08); margin-bottom:8px; font-size:13px; }
  .alert-item .ai-loc{ font-family: var(--font-mono); font-size:12px; color: var(--text-dim); }

  .hint{ font-size: 12px; color: var(--text-dim); font-style: italic; }

  @media (max-width: 560px){
    .brand-text p{ display:none; }
    .placard-code{ letter-spacing:1px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){

  // ---------- Almacenamiento ----------
  // Dentro de la vista previa de Claude existe window.storage. Fuera de ahí (app
  // instalada, hosting propio) no existe, así que usamos localStorage como respaldo.
  const localAdapter = {
    async get(key){
      const raw = localStorage.getItem(key);
      return raw !== null ? { key, value: raw, shared: false } : null;
    },
    async set(key, value){ localStorage.setItem(key, value); return { key, value, shared: false }; },
    async delete(key){ localStorage.removeItem(key); return { key, deleted: true, shared: false }; },
  };
  const storageAdapter = (typeof window !== 'undefined' && window.storage) ? window.storage : localAdapter;

  const FIELDS = [
    {key:'nombre', label:'Nombre / Descripción', required:true, keywords:['nombre','insumo','descripcion','producto','articulo','item']},
    {key:'codigo', label:'Código / Referencia', required:false, keywords:['codigo','sku','referencia','ref','id']},
    {key:'categoria', label:'Categoría', required:false, keywords:['categoria','tipo','familia','linea','grupo']},
    {key:'pasillo', label:'Pasillo', required:true, keywords:['pasillo','aisle','zona','bloque']},
    {key:'rack', label:'Rack / Estante', required:false, keywords:['rack','estante','modulo']},
    {key:'nivel', label:'Nivel / Posición', required:false, keywords:['nivel','posicion','level','piso','fila']},
    {key:'cantidad', label:'Cantidad disponible', required:false, keywords:['cantidad','stock','existencia','saldo']},
    {key:'unidad', label:'Unidad de medida', required:false, keywords:['unidad','um','medida']},
    {key:'stockMinimo', label:'Stock mínimo (alertas)', required:false, keywords:['minimo','stock min','reorden']},
  ];
  const PALETTE = ['#F5B400','#4F86A6','#4CAF7D','#E1573F','#C68F00','#8A6FB0'];

  const state = {
    stage: 'loading', // loading | empty | mapping | ready
    activeTab: 'datos',
    rawData: null, headers: null, mapping: {}, fileName: '', updatedAt: null,
    inventory: [],
    searchQuery: '', filterPasillo: '', filterCategoria: '',
    selectedItem: null,
    page: 1, pageSize: 15,
    searchHistory: {},
    error: null,
    listening: false, voiceSupported: false, voiceError: null,
    ttsSupported: false, voiceResponseEnabled: true, lastSearchWasVoice: false, speaking: false,
    online: (typeof navigator !== 'undefined') ? navigator.onLine : true,
    canInstall: false, showIosTip: false,
  };

  const norm = s => (s === null || s === undefined) ? '' : String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  const naturalCompare = (a,b) => String(a).localeCompare(String(b), undefined, {numeric:true, sensitivity:'base'});
  const esc = s => (s===null||s===undefined) ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function autoGuessMapping(headers){
    const used = new Set();
    const mapping = {};
    FIELDS.forEach(f => {
      let found = null;
      for(const h of headers){
        if(used.has(h)) continue;
        const nh = norm(h);
        if(f.keywords.some(k => nh.includes(k))){ found = h; break; }
      }
      mapping[f.key] = found;
      if(found) used.add(found);
    });
    return mapping;
  }

  function buildInventory(rawData, mapping){
    if(!rawData) return [];
    return rawData.map((row, idx) => {
      const get = key => mapping[key] ? row[mapping[key]] : '';
      const cRaw = get('cantidad'), mRaw = get('stockMinimo');
      const cantidad = (cRaw !== '' && cRaw !== undefined && !isNaN(parseFloat(cRaw))) ? parseFloat(cRaw) : null;
      const stockMinimo = (mRaw !== '' && mRaw !== undefined && !isNaN(parseFloat(mRaw))) ? parseFloat(mRaw) : null;
      return {
        id: idx,
        codigo: String(get('codigo') || '').trim(),
        nombre: String(get('nombre') || '').trim(),
        categoria: String(get('categoria') || '').trim(),
        pasillo: String(get('pasillo') || '').trim(),
        rack: String(get('rack') || '').trim(),
        nivel: String(get('nivel') || '').trim(),
        cantidad, unidad: String(get('unidad') || '').trim(), stockMinimo,
      };
    }).filter(item => item.nombre);
  }

  async function saveInventoryData(){
    try{
      await storageAdapter.set('inventario-datos', JSON.stringify({
        rawData: state.rawData, headers: state.headers, mapping: state.mapping,
        fileName: state.fileName, updatedAt: state.updatedAt
      }), false);
    }catch(err){ console.error('No se pudo guardar el inventario', err); }
  }

  async function recordSearchHit(nombre){
    state.searchHistory[nombre] = (state.searchHistory[nombre] || 0) + 1;
    try{ await storageAdapter.set('busquedas-frecuentes', JSON.stringify(state.searchHistory), false); }
    catch(err){ /* silencioso */ }
  }

  // ---------- Búsqueda por voz ----------
  let recognition = null;
  function setupVoiceRecognition(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ state.voiceSupported = false; return; }
    state.voiceSupported = true;
    recognition = new SR();
    recognition.lang = 'es-CO';
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => { state.listening = true; state.voiceError = null; render(); };
    recognition.onresult = e => {
      state.searchQuery = e.results[0][0].transcript.trim();
      state.page = 1;
    };
    recognition.onerror = e => {
      state.listening = false;
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
        state.voiceError = 'Permiso de micrófono denegado. Actívalo en la configuración del navegador para este sitio.';
      } else if(e.error === 'no-speech'){
        state.voiceError = 'No detectamos ninguna voz. Intenta de nuevo.';
      } else {
        state.voiceError = 'No se pudo usar el micrófono en este navegador.';
      }
      render();
    };
    recognition.onend = () => {
      state.listening = false;
      if(state.lastSearchWasVoice && state.searchQuery){
        const matches = filteredInventory();
        if(matches.length >= 1){ selectItem(matches[0], state.voiceResponseEnabled); return; }
      }
      render();
    };
  }

  function setupSpeechSynthesis(){
    state.ttsSupported = 'speechSynthesis' in window;
    if(state.ttsSupported){
      try{ window.speechSynthesis.getVoices(); }catch(err){}
    }
  }

  // ---------- PWA: instalación, conexión y service worker ----------
  let deferredInstallPrompt = null;
  function setupPWA(){
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredInstallPrompt = e;
      state.canInstall = true;
      render();
    });
    window.addEventListener('appinstalled', () => {
      state.canInstall = false; deferredInstallPrompt = null; render();
    });
    window.addEventListener('online', () => { state.online = true; render(); });
    window.addEventListener('offline', () => { state.online = false; render(); });

    try{
      const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
      const isStandalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
      if(isIos && !isStandalone){
        storageAdapter.get('ios-tip-dismissed').then(res => {
          if(!res || !res.value){ state.showIosTip = true; render(); }
        }).catch(() => { state.showIosTip = true; render(); });
      }
    }catch(err){ /* deteccion de plataforma no disponible */ }

    if('serviceWorker' in navigator){
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {
          /* no disponible en este contexto (p. ej. vista previa embebida) */
        });
      });
    }
  }

  function buildSpeechText(item){
    const loc = [
      item.pasillo ? `pasillo ${item.pasillo}` : '',
      item.rack ? `rack ${item.rack}` : '',
      item.nivel ? `nivel ${item.nivel}` : '',
    ].filter(Boolean).join(', ');
    let text = loc ? `${item.nombre}. Ubicación: ${loc}.` : `${item.nombre} no tiene ubicación registrada.`;
    if(item.cantidad !== null){
      text += ` Cantidad disponible: ${item.cantidad}${item.unidad ? ' ' + item.unidad : ''}.`;
      if(item.stockMinimo !== null && item.cantidad <= item.stockMinimo){
        text += ' Está por debajo del stock mínimo.';
      }
    }
    return text;
  }

  function speak(text){
    if(!state.ttsSupported) return;
    try{
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'es-CO';
      utter.rate = 1;
      const voices = window.speechSynthesis.getVoices();
      const esVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('es'));
      if(esVoice) utter.voice = esVoice;
      utter.onstart = () => { state.speaking = true; render(); };
      utter.onend = () => { state.speaking = false; render(); };
      utter.onerror = () => { state.speaking = false; render(); };
      window.speechSynthesis.speak(utter);
    }catch(err){ console.error('No se pudo reproducir el audio', err); }
  }

  function selectItem(item, autoSpeak){
    state.selectedItem = item;
    recordSearchHit(item.nombre);
    render();
    window.scrollTo({top:0, behavior:'smooth'});
    if(autoSpeak) speak(buildSpeechText(item));
  }

  async function init(){
    setupVoiceRecognition();
    setupSpeechSynthesis();
    setupPWA();
    try{
      const res = await storageAdapter.get('inventario-datos', false);
      if(res && res.value){
        const parsed = JSON.parse(res.value);
        state.rawData = parsed.rawData; state.headers = parsed.headers; state.mapping = parsed.mapping || {};
        state.fileName = parsed.fileName; state.updatedAt = parsed.updatedAt;
        state.inventory = buildInventory(state.rawData, state.mapping);
        state.stage = 'ready'; state.activeTab = 'buscar';
      } else { state.stage = 'empty'; state.activeTab = 'datos'; }
    }catch(err){ state.stage = 'empty'; state.activeTab = 'datos'; }

    try{
      const hist = await storageAdapter.get('busquedas-frecuentes', false);
      state.searchHistory = (hist && hist.value) ? JSON.parse(hist.value) : {};
    }catch(err){ state.searchHistory = {}; }

    render();
  }

  // ---------- Icons ----------
  const ICO_SEARCH = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#93A0AA" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>';
  const ICO_UPLOAD = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#F5B400" stroke-width="1.6"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>';
  const ICO_MIC = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>';
  const ICO_SPEAKER = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 9 8 9 13 4 13 20 8 15 3 15 3 9"/><path d="M16.5 8.5a5 5 0 010 7"/><path d="M19.5 5.5a9 9 0 010 13"/></svg>';

  // ---------- Render pieces ----------
  function renderTopbar(){
    const meta = state.stage === 'ready'
      ? `<div class="topbar-meta">
           <span>${esc(state.fileName || 'archivo')} · ${state.updatedAt ? new Date(state.updatedAt).toLocaleDateString('es-CO', {day:'2-digit', month:'short', year:'numeric'}) : ''}</span>
           <button id="btn-change-data">Cambiar datos</button>
         </div>`
      : '';
    const bits = [];
    if(!state.online) bits.push(`<span class="status-pill offline">Sin conexión · usando datos guardados</span>`);
    if(state.canInstall) bits.push(`<button class="status-pill install" id="btn-install-app">Instalar app</button>`);
    if(state.showIosTip) bits.push(`<span class="status-pill ios-tip">En iPhone: toca compartir <b>⬆</b> → "Agregar a inicio" <button id="btn-dismiss-ios-tip" aria-label="Cerrar aviso">✕</button></span>`);
    return `
      <div class="topbar">
        <div class="brand">
          <div class="brand-mark">U</div>
          <div class="brand-text">
            <h1>Ubica</h1>
            <p>Buscador de ubicaciones — almacén de insumos</p>
          </div>
        </div>
        ${meta}
      </div>
      ${bits.length ? `<div class="install-row">${bits.join('')}</div>` : ''}`;
  }

  function renderTabs(){
    const tabs = [
      {id:'buscar', label:'Buscar'},
      {id:'dashboard', label:'Dashboard'},
      {id:'datos', label:'Datos'},
    ];
    return `<div class="tabs">${tabs.map(t => `<button class="tab-btn ${state.activeTab===t.id?'active':''}" data-tab="${t.id}">${t.label}</button>`).join('')}</div>`;
  }

  function renderDatosTab(){
    if(state.stage === 'mapping'){
      return `
      <div class="panel">
        <p class="map-title">Mapea las columnas de tu archivo</p>
        <p class="map-sub">Detectamos ${state.headers.length} columnas en <strong>${esc(state.fileName)}</strong>. Confirma qué columna corresponde a cada dato (mínimo requerido: Nombre y Pasillo).</p>
        <div class="map-grid">
          ${FIELDS.map(f => `
            <div class="map-field">
              <label>${f.label} ${f.required?'<span class="req">*</span>':''}</label>
              <select id="map-${f.key}">
                <option value="__none__">No aplica</option>
                ${state.headers.map(h => `<option value="${esc(h)}" ${state.mapping[f.key]===h?'selected':''}>${esc(h)}</option>`).join('')}
              </select>
            </div>`).join('')}
        </div>
        <div class="row-actions">
          <button class="btn btn-primary" id="btn-save-mapping">Guardar y procesar</button>
          <button class="btn btn-ghost" id="btn-cancel-mapping">Cancelar</button>
        </div>
      </div>`;
    }

    const hasData = state.stage === 'ready';
    return `
      <div class="panel">
        ${hasData ? `<p class="map-sub" style="margin-bottom:20px;">Datos actuales: <strong>${esc(state.fileName)}</strong> · ${state.inventory.length} insumos cargados · actualizado ${state.updatedAt ? new Date(state.updatedAt).toLocaleString('es-CO') : ''}.</p>` : ''}
        <div class="dropzone" id="dropzone">
          ${ICO_UPLOAD}
          <div class="dz-title">Sube tu archivo de insumos</div>
          <div class="dz-sub">Arrastra un .xlsx, .xls o .csv aquí, o haz clic para elegir el archivo</div>
        </div>
        <input type="file" id="file-input" accept=".xlsx,.xls,.csv" style="display:none">
        ${hasData ? `<div style="margin-top:18px;"><button class="btn btn-ghost" id="btn-delete-data">Borrar datos guardados</button></div>` : ''}
        ${state.error ? `<p style="color:var(--red); font-size:13px; margin-top:14px;">${esc(state.error)}</p>` : ''}
      </div>`;
  }

  function getUniquePasillos(){
    return [...new Set(state.inventory.map(i => i.pasillo).filter(Boolean))].sort(naturalCompare);
  }
  function getUniqueCategorias(){
    return [...new Set(state.inventory.map(i => i.categoria).filter(Boolean))].sort(naturalCompare);
  }

  function filteredInventory(){
    const q = norm(state.searchQuery);
    return state.inventory.filter(item => {
      if(state.filterPasillo && item.pasillo !== state.filterPasillo) return false;
      if(state.filterCategoria && item.categoria !== state.filterCategoria) return false;
      if(!q) return true;
      return norm(item.nombre).includes(q) || norm(item.codigo).includes(q);
    });
  }

  function renderPlacard(item){
    const pasillos = getUniquePasillos();
    const idx = pasillos.indexOf(item.pasillo);
    const strip = pasillos.map((p,i) => `<div class="blk ${i===idx?'on':''}"></div>`).join('');
    const hasStock = item.cantidad !== null;
    const lowStock = hasStock && item.stockMinimo !== null && item.cantidad <= item.stockMinimo;
    const locParts = [item.pasillo, item.rack, item.nivel].filter(Boolean);
    return `
      <div class="placard">
        <div class="placard-top">
          <div>
            <div class="placard-eyebrow">${item.codigo ? 'Código ' + esc(item.codigo) : 'Ubicación de insumo'}</div>
            <div class="placard-name">${esc(item.nombre)}</div>
          </div>
          <button class="placard-close" id="btn-close-placard">Cerrar ✕</button>
        </div>
        ${state.ttsSupported ? `<div class="placard-actions" style="margin:-6px 0 4px;"><button class="speak-btn ${state.speaking?'speaking':''}" id="btn-speak-placard">${ICO_SPEAKER} ${state.speaking?'Reproduciendo...':'Escuchar ubicación'}</button></div>` : ''}
        <div class="placard-code">${locParts.length ? esc(locParts.join(' · ')) : 'Sin ubicación registrada'}</div>
        ${pasillos.length > 1 ? `<div class="placard-strip">${strip}</div>` : ''}
        <div class="placard-grid">
          ${item.pasillo ? `<div class="placard-field"><div class="pf-label">Pasillo</div><div class="pf-value">${esc(item.pasillo)}</div></div>` : ''}
          ${item.rack ? `<div class="placard-field"><div class="pf-label">Rack</div><div class="pf-value">${esc(item.rack)}</div></div>` : ''}
          ${item.nivel ? `<div class="placard-field"><div class="pf-label">Nivel</div><div class="pf-value">${esc(item.nivel)}</div></div>` : ''}
          ${item.categoria ? `<div class="placard-field"><div class="pf-label">Categoría</div><div class="pf-value">${esc(item.categoria)}</div></div>` : ''}
          ${hasStock ? `<div class="placard-field"><div class="pf-label">Cantidad</div><div class="pf-value ${lowStock?'alert':'ok'}">${item.cantidad}${item.unidad ? ' '+esc(item.unidad) : ''}</div></div>` : ''}
          ${lowStock ? `<div class="placard-field"><div class="pf-label">Estado</div><div class="pf-value alert">Stock bajo</div></div>` : ''}
        </div>
      </div>`;
  }

  function renderBuscarTab(){
    if(state.stage !== 'ready'){
      return `<div class="panel empty-state">
        <h2>Aún no hay datos cargados</h2>
        <p>Ve a la pestaña "Datos" y sube tu archivo de insumos para empezar a buscar ubicaciones.</p>
        <button class="btn btn-primary" id="btn-go-datos">Cargar archivo</button>
      </div>`;
    }
    const pasillos = getUniquePasillos();
    const categorias = getUniqueCategorias();
    const results = filteredInventory();
    const showTable = !state.searchQuery;
    const start = (state.page - 1) * state.pageSize;
    const pageItems = results.slice(start, start + state.pageSize);
    const totalPages = Math.max(1, Math.ceil(results.length / state.pageSize));

    return `
      <div class="search-bar">
        <div class="search-input-wrap">
          ${ICO_SEARCH}
          <input class="search-input" id="search-input" placeholder="${state.listening ? 'Escuchando...' : 'Buscar por nombre o código de insumo...'}" value="${esc(state.searchQuery)}">
          ${state.voiceSupported ? `<button type="button" class="mic-btn ${state.listening?'listening':''}" id="btn-voice-search" title="Buscar por voz" aria-label="Buscar por voz">${ICO_MIC}</button>` : ''}
        </div>
        ${pasillos.length ? `<select class="filter-select" id="filter-pasillo"><option value="">Todos los pasillos</option>${pasillos.map(p=>`<option value="${esc(p)}" ${state.filterPasillo===p?'selected':''}>${esc(p)}</option>`).join('')}</select>` : ''}
        ${categorias.length ? `<select class="filter-select" id="filter-categoria"><option value="">Todas las categorías</option>${categorias.map(c=>`<option value="${esc(c)}" ${state.filterCategoria===c?'selected':''}>${esc(c)}</option>`).join('')}</select>` : ''}
        ${state.ttsSupported ? `<button type="button" class="voice-toggle ${state.voiceResponseEnabled?'on':''}" id="btn-voice-toggle" title="Activar o desactivar respuesta hablada tras buscar por voz"><span class="dot"></span>Respuesta por voz</button>` : ''}
      </div>
      ${state.voiceError ? `<p class="voice-error">${esc(state.voiceError)}</p>` : ''}
      ${state.selectedItem ? renderPlacard(state.selectedItem) : ''}
      ${!showTable ? `
        <p class="results-count">${results.length} resultado(s)</p>
        ${results.length === 0 ? `<p class="hint">No encontramos insumos que coincidan con "${esc(state.searchQuery)}".</p>` : results.slice(0,30).map(item => `
          <div class="result-row" data-select-id="${item.id}">
            <div><div class="rr-name">${esc(item.nombre)}</div><div class="rr-sub">${item.codigo ? esc(item.codigo) : '—'}${item.categoria ? ' · ' + esc(item.categoria) : ''}</div></div>
            <div class="rr-loc">${[item.pasillo,item.rack,item.nivel].filter(Boolean).map(esc).join(' · ') || 'Sin ubicación'}</div>
          </div>`).join('')}
      ` : `
        <div class="table-wrap">
          <table>
            <thead><tr><th>Nombre</th><th>Código</th><th>Categoría</th><th>Pasillo</th><th>Rack</th><th>Nivel</th><th>Cant.</th></tr></thead>
            <tbody>
              ${pageItems.map(item => {
                const low = item.cantidad!==null && item.stockMinimo!==null && item.cantidad<=item.stockMinimo;
                return `<tr class="${low?'tr-alert':''}" data-select-id="${item.id}" style="cursor:pointer;">
                  <td>${esc(item.nombre)}</td><td>${esc(item.codigo)||'—'}</td><td>${esc(item.categoria)||'—'}</td>
                  <td>${esc(item.pasillo)||'—'}</td><td>${esc(item.rack)||'—'}</td><td>${esc(item.nivel)||'—'}</td>
                  <td>${item.cantidad!==null?item.cantidad:'—'}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
        <div class="pagination">
          <span>Página ${state.page} de ${totalPages} · ${results.length} insumos</span>
          <div class="row-actions">
            <button id="btn-prev-page" ${state.page<=1?'disabled':''}>← Anterior</button>
            <button id="btn-next-page" ${state.page>=totalPages?'disabled':''}>Siguiente →</button>
          </div>
        </div>
      `}
    `;
  }

  function renderBarChart(counts){
    const max = Math.max(...counts.map(c=>c.count), 1);
    return counts.map(c => `
      <div class="bar-row">
        <div class="bar-label" title="${esc(c.label)}">${esc(c.label)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(c.count/max*100).toFixed(1)}%"></div></div>
        <div class="bar-val">${c.count}</div>
      </div>`).join('');
  }

  function renderDonut(counts){
    const total = counts.reduce((s,c)=>s+c.count,0) || 1;
    let acc = 0;
    const R = 15.9155, C = 2*Math.PI*R;
    const segs = counts.map((c,i) => {
      const frac = c.count/total;
      const dash = frac*C;
      const seg = `<circle cx="18" cy="18" r="${R}" fill="none" stroke="${PALETTE[i%PALETTE.length]}" stroke-width="4.5" stroke-dasharray="${dash.toFixed(2)} ${(C-dash).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" />`;
      acc += dash;
      return seg;
    }).join('');
    const legend = counts.map((c,i) => `<div class="legend-item"><div class="legend-dot" style="background:${PALETTE[i%PALETTE.length]}"></div>${esc(c.label)} (${c.count})</div>`).join('');
    return `<div class="donut-wrap">
      <svg width="140" height="140" viewBox="0 0 36 36">${segs}</svg>
      <div class="legend">${legend}</div>
    </div>`;
  }

  function renderDashboardTab(){
    if(state.stage !== 'ready'){
      return `<div class="panel empty-state">
        <h2>Sin datos para mostrar</h2>
        <p>Carga tu archivo de insumos en la pestaña "Datos" para ver el dashboard.</p>
        <button class="btn btn-primary" id="btn-go-datos">Cargar archivo</button>
      </div>`;
    }
    const inv = state.inventory;
    const pasillos = getUniquePasillos();
    const categorias = getUniqueCategorias();
    const withStock = inv.filter(i => i.cantidad !== null && i.stockMinimo !== null);
    const lowStock = withStock.filter(i => i.cantidad <= i.stockMinimo).sort((a,b) => (a.cantidad-a.stockMinimo)-(b.cantidad-b.stockMinimo));

    const pasilloCounts = pasillos.map(p => ({label:p, count: inv.filter(i=>i.pasillo===p).length})).sort((a,b)=>naturalCompare(a.label,b.label));
    const catCounts = categorias.map(c => ({label:c, count: inv.filter(i=>i.categoria===c).length})).sort((a,b)=>b.count-a.count).slice(0,6);

    const topSearches = Object.entries(state.searchHistory).sort((a,b)=>b[1]-a[1]).slice(0,5);

    return `
      <div class="kpi-grid">
        <div class="kpi-card"><div class="kv">${inv.length}</div><div class="kl">Insumos totales</div></div>
        <div class="kpi-card"><div class="kv">${pasillos.length}</div><div class="kl">Pasillos activos</div></div>
        <div class="kpi-card"><div class="kv">${categorias.length || '—'}</div><div class="kl">Categorías</div></div>
        <div class="kpi-card ${lowStock.length?'alertc':''}"><div class="kv">${withStock.length ? lowStock.length : '—'}</div><div class="kl">Alertas de stock bajo</div></div>
      </div>

      <div class="dash-section">
        <p class="dash-title">Insumos por pasillo</p>
        <div class="panel">${pasilloCounts.length ? renderBarChart(pasilloCounts) : '<p class="hint">No hay pasillos registrados.</p>'}</div>
      </div>

      <div class="dash-section">
        <p class="dash-title">Insumos por categoría</p>
        <div class="panel">${catCounts.length ? renderDonut(catCounts) : '<p class="hint">Mapea una columna de categoría en "Datos" para ver este gráfico.</p>'}</div>
      </div>

      <div class="dash-section">
        <p class="dash-title">Alertas de stock bajo</p>
        <div class="panel alert-list">
          ${!withStock.length ? '<p class="hint">Mapea "Cantidad disponible" y "Stock mínimo" en "Datos" para activar alertas.</p>'
            : lowStock.length ? lowStock.slice(0,10).map(i => `
              <div class="alert-item">
                <div><strong>${esc(i.nombre)}</strong><div class="ai-loc">${[i.pasillo,i.rack,i.nivel].filter(Boolean).map(esc).join(' · ')}</div></div>
                <div>${i.cantidad}${i.unidad?esc(' '+i.unidad):''} / mín. ${i.stockMinimo}</div>
              </div>`).join('') : '<p class="hint">Todo el inventario está por encima del stock mínimo.</p>'}
        </div>
      </div>

      ${topSearches.length ? `
      <div class="dash-section">
        <p class="dash-title">Insumos más consultados</p>
        <div class="panel">
          ${topSearches.map(([name,count]) => `<div class="bar-row"><div class="bar-label" style="width:auto; text-align:left; flex:1;">${esc(name)}</div><div class="bar-val">${count}×</div></div>`).join('')}
        </div>
      </div>` : ''}
    `;
  }

  function render(){
    const app = document.getElementById('app');
    let body = '';
    if(state.stage === 'loading'){
      body = `<div class="panel empty-state"><h2>Cargando...</h2></div>`;
    } else if(state.activeTab === 'datos'){
      body = renderDatosTab();
    } else if(state.activeTab === 'buscar'){
      body = renderBuscarTab();
    } else {
      body = renderDashboardTab();
    }
    app.innerHTML = renderTopbar() + (state.stage!=='loading' ? renderTabs() : '') + body;
    attachListeners();
  }

  // ---------- Events ----------
  function attachListeners(){
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => { state.activeTab = btn.dataset.tab; state.selectedItem=null; if(state.ttsSupported) window.speechSynthesis.cancel(); render(); });
    });
    const goDatos = document.getElementById('btn-go-datos');
    if(goDatos) goDatos.addEventListener('click', () => { state.activeTab='datos'; render(); });

    const changeData = document.getElementById('btn-change-data');
    if(changeData) changeData.addEventListener('click', () => { state.activeTab='datos'; state.stage='ready'; render(); });

    const installBtn = document.getElementById('btn-install-app');
    if(installBtn) installBtn.addEventListener('click', async () => {
      if(!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      state.canInstall = false;
      render();
    });
    const dismissIos = document.getElementById('btn-dismiss-ios-tip');
    if(dismissIos) dismissIos.addEventListener('click', async () => {
      state.showIosTip = false; render();
      try{ await storageAdapter.set('ios-tip-dismissed', '1'); }catch(err){}
    });

    const deleteData = document.getElementById('btn-delete-data');
    if(deleteData) deleteData.addEventListener('click', async () => {
      if(!confirm('¿Borrar los datos guardados? Tendrás que volver a subir el archivo.')) return;
      try{ await storageAdapter.delete('inventario-datos', false); }catch(err){}
      state.rawData=null; state.headers=null; state.mapping={}; state.inventory=[]; state.fileName=''; state.updatedAt=null;
      state.stage='empty'; state.activeTab='datos'; render();
    });

    const dz = document.getElementById('dropzone');
    const fi = document.getElementById('file-input');
    if(dz && fi){
      dz.addEventListener('click', () => fi.click());
      dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
      dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
      dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag'); if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
      fi.addEventListener('change', e => { if(e.target.files[0]) handleFile(e.target.files[0]); });
    }

    const saveMap = document.getElementById('btn-save-mapping');
    if(saveMap) saveMap.addEventListener('click', async () => {
      const mapping = {};
      FIELDS.forEach(f => {
        const sel = document.getElementById('map-'+f.key);
        mapping[f.key] = sel.value === '__none__' ? null : sel.value;
      });
      if(!mapping.nombre || !mapping.pasillo){ alert('Debes mapear al menos "Nombre / Descripción" y "Pasillo" para continuar.'); return; }
      state.mapping = mapping;
      state.inventory = buildInventory(state.rawData, state.mapping);
      state.updatedAt = new Date().toISOString();
      await saveInventoryData();
      state.stage = 'ready'; state.activeTab = 'buscar'; state.page = 1;
      render();
    });
    const cancelMap = document.getElementById('btn-cancel-mapping');
    if(cancelMap) cancelMap.addEventListener('click', () => {
      state.stage = state.inventory.length ? 'ready' : 'empty';
      render();
    });

    const searchInput = document.getElementById('search-input');
    if(searchInput){
      searchInput.addEventListener('input', e => { state.searchQuery = e.target.value; state.page = 1; state.lastSearchWasVoice = false; render(); searchInput.focus(); searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length); });
    }
    const micBtn = document.getElementById('btn-voice-search');
    if(micBtn) micBtn.addEventListener('click', () => {
      if(!recognition) return;
      if(state.listening){ recognition.stop(); return; }
      state.voiceError = null;
      state.lastSearchWasVoice = true;
      if(state.ttsSupported) window.speechSynthesis.cancel();
      try{ recognition.start(); }catch(err){ /* ya estaba escuchando */ }
    });
    const voiceToggle = document.getElementById('btn-voice-toggle');
    if(voiceToggle) voiceToggle.addEventListener('click', () => {
      state.voiceResponseEnabled = !state.voiceResponseEnabled;
      if(!state.voiceResponseEnabled && state.ttsSupported) window.speechSynthesis.cancel();
      render();
    });

    const fp = document.getElementById('filter-pasillo');
    if(fp) fp.addEventListener('change', e => { state.filterPasillo = e.target.value; state.page=1; render(); });
    const fc = document.getElementById('filter-categoria');
    if(fc) fc.addEventListener('change', e => { state.filterCategoria = e.target.value; state.page=1; render(); });

    document.querySelectorAll('[data-select-id]').forEach(el => {
      el.addEventListener('click', () => {
        const id = parseInt(el.dataset.selectId, 10);
        const item = state.inventory.find(i => i.id === id);
        if(item) selectItem(item, false);
      });
    });
    const speakBtn = document.getElementById('btn-speak-placard');
    if(speakBtn) speakBtn.addEventListener('click', () => { if(state.selectedItem) speak(buildSpeechText(state.selectedItem)); });

    const closeP = document.getElementById('btn-close-placard');
    if(closeP) closeP.addEventListener('click', () => { state.selectedItem = null; if(state.ttsSupported) window.speechSynthesis.cancel(); render(); });

    const prevPage = document.getElementById('btn-prev-page');
    if(prevPage) prevPage.addEventListener('click', () => { state.page--; render(); });
    const nextPage = document.getElementById('btn-next-page');
    if(nextPage) nextPage.addEventListener('click', () => { state.page++; render(); });
  }

  async function handleFile(file){
    state.error = null;
    try{
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(ws, {defval:''});
      if(!json.length){ state.error = 'El archivo no contiene datos.'; render(); return; }
      state.rawData = json;
      state.headers = Object.keys(json[0]);
      state.mapping = autoGuessMapping(state.headers);
      state.fileName = file.name;
      state.stage = 'mapping';
      render();
    }catch(err){
      console.error(err);
      state.error = 'No pudimos leer el archivo. Verifica que sea un .xlsx, .xls o .csv válido.';
      render();
    }
  }

  init();
})();
</script>
</body>
</html>
